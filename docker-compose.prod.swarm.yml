# Docker Swarm / Portainer con endpoint "Swarm".
# Swarm NO ejecuta `build:` al desplegar: construye las imágenes y súbelas a un registry antes.
#
# Build (ejemplo con Docker Hub; cambia usuario/registry):
#   docker build -f backend/Dockerfile -t TU_USUARIO/kuducart-medusa:latest ./backend
#   docker build -f Dockerfile.frontend \
#     --build-arg NEXT_PUBLIC_MEDUSA_URL=https://api.kuducart.co.za \
#     --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_xxx \
#     --build-arg NEXT_PUBLIC_MEDUSA_REGION_ID=reg_xxx \
#     --build-arg NEXT_PUBLIC_MEDUSA_PAYMENT_PROVIDER_ID=pp_system_default \
#     -t TU_USUARIO/kuducart-frontend:latest .
#   docker push TU_USUARIO/kuducart-medusa:latest
#   docker push TU_USUARIO/kuducart-frontend:latest
#
# En Portainer: Compose path = docker-compose.prod.swarm.yml
# Variables obligatorias: MEDUSA_IMAGE, FRONTEND_IMAGE (+ resto como .env.docker.example)

services:
  postgres:
    image: postgres:16-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medusa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-medusa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  medusa:
    image: ${MEDUSA_IMAGE}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      NODE_ENV: production
      PORT: 9000
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD:-medusa}@postgres:5432/${POSTGRES_DB:-medusa}
      REDIS_URL: redis://redis:6379
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${MEDUSA_PORT:-9010}:9000"

  frontend:
    image: ${FRONTEND_IMAGE}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_MEDUSA_URL: ${NEXT_PUBLIC_MEDUSA_URL}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_MEDUSA_REGION_ID: ${NEXT_PUBLIC_MEDUSA_REGION_ID}
      NEXT_PUBLIC_MEDUSA_PAYMENT_PROVIDER_ID: ${NEXT_PUBLIC_MEDUSA_PAYMENT_PROVIDER_ID}
    ports:
      - "${FRONTEND_PORT:-3010}:3000"

volumes:
  postgres_data:
  redis_data:
